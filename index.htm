        function parseInput(input /* string */) {
            const lines = input.split("\n");

            let result = [];

            // Regex parts, and assumptions made:
            //   NAME: [\-A-Za-z '].  Alphabetical, space, hyphen, and apostrophe
            //   MAP: [A-Za-z '].  Alphabetical, space, apostrophe
            //   INSTANCE: [\ue0b1-\ue0b8].  FFXIV special characters for instance numbers
            //   COORDS: (\d+\.\d).  Numbers with exactly one decimal place
            const re = /^([\-A-Za-z ']+) @ \ue0bb([A-Za-z ']+)([\ue0b1-\ue0b8])? \( (\d+\.\d) , (\d+\.\d) \)(?: Instance [A-Z]+)?$/u;
            for (const line of lines) {
                const match = re.exec(line);
                
                if (match === null || match === undefined) {
                    continue;
                }

                let entry = {
                    "Name": match[1],
                    "MapName": match[2],
                    "Instance": match[3] !== undefined ? (match[3].charCodeAt(0) - 0xe0b0) : 0,
                    "Position": {
                        "X": match[4],
                        "Y": match[5]
                    }
                };

                result.push(entry);
            }

            return result;
        }

        // Tidies the data from Turtle (inconsistent capitalization), and adds the extra
        // fields in the json imported by the Hunt Helper plugin
        function toHuntHelper(entries /* array of object */) {
            // Add 4 more digits of "precision" for compatibility with plugin
            const now = new Date().toISOString().replace("Z", "0000Z");

            for(let ix in entries) {
                let entry = entries[ix];

                const name = entry.Name.toLowerCase();
                const zone = entry.MapName.toLowerCase();

                entry["Name"] = mobNames[name];
                entry["MobID"] = mobIds[name];
                entry["TerritoryId"] = territoryIds[zone];
                entry["MapID"] = mapIds[zone];
                entry["Dead"] = false;
                entry["LastSeenUTC"] = now;

                entries[ix] = entry;
            }

            return entries;
        }

        async function compress(text /* string */) {
            const rawBytes = new TextEncoder().encode(text);
            const stream = new Blob([rawBytes]).stream().pipeThrough(new CompressionStream("gzip"));

            const response = new Response(stream);
            return new Uint8Array(
                await response.arrayBuffer()
            );
        }

        async function processInput() {
            const input = document.getElementById("input").value;

            const entries = parseInput(input);
            const marks = toHuntHelper(entries);
            const resultBytes = await compress(JSON.stringify(marks));

            let binary = "";
            for (const byte of resultBytes) {
                binary += String.fromCharCode(byte);
            }

            const encoded = btoa(binary);

            document.getElementById("output").value = encoded;
        }

        function copyOutput() {
            const output = document.getElementById("output");

            navigator.clipboard.writeText(output.value);
        }
