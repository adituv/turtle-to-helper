
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Turtle to Hunt Helper Converetr</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        textarea {
            width: 100%;
            min-height: 180px;
            box-sizing: border-box;
            padding: 10px;
            font-family: monospace;
            font-size: 14px;
        }

        button {
            margin: 12px 8px 12px 0;
            padding: 10px 18px;
            cursor: pointer;
        }

        #output {
            min-height: 120px;
        }
    </style>
</head>

<body>
    <h1>Turtle to Hunt Helper Converter</h1>

    <p><i>Note: only works for Dawntrail currently</i></p>

    <h3>Input</h3>
    <textarea id="input" placeholder="Paste export here..."></textarea>

    <br>
    <button onclick="processInput()">Convert</button>

    <h3>Output (Base64)</h3>
    <textarea id="output" readonly></textarea>

    <br>
    <button onclick="copyOutput()">Copy Output</button>

    <script>
        const mobNames = {
            "queen hawk": "Queen Hawk",
            "nechuciho": "Nechuciho",
            "the raintriller": "The Raintriller",
            "pkuucha": "Pkuucha",
            "starcrier": "Starcrier",
            "rrax yity'a": "Rrax Yity'a",
            "yehehetoaua'pyo": "Yehehetoaua'pyo",
            "keheniheyamewi": "Keheniheyamewi",
            "urna variabilis": "Urna Variabilis",
            "heshuala": "Heshuala",
            "sally the sweeper": "Sally the Sweeper",
            "cat's eye": "Cat's Eye"
        };

        const mobIds = {
            "queen hawk": 13361,
            "nechuciho": 13362,
            "the raintriller": 13442,
            "pkuucha": 13443,
            "starcrier": 12692,
            "rrax yity'a": 12753,
            "yehehetoaua'pyo": 13400,
            "keheniheyamewi": 13401,
            "urna variabilis": 13158,
            "heshuala": 13157,
            "sally the sweeper": 13435,
            "cat's eye": 13436
        };

        const territoryIds = {
            "urqopacha": 1187,
            "kozama'uka": 1188,
            "yak t'el": 1189,
            "shaaloani": 1190,
            "heritage found": 1191,
            "living memory": 1192
        };

        const mapIds = {
            "urqopacha": 857,
            "kozama'uka": 858,
            "yak t'el": 859,
            "shaaloani": 860,
            "heritage found": 861,
            "living memory": 862
        };

        function parseInput(input /* string */) {
            const lines = input.split("\n");

            let result = [];
            const re = /^([A-Za-z ']+) @ \ue0bb([A-Za-z ']+)([\ue0b1-\ue0b8])? \( (\d+\.\d) , (\d+\.\d) \)(?: Instance [A-Z]+)?$/u;
            for (const line of lines) {
                const match = re.exec(line);
                
                if (match === null || match === undefined) {
                    continue;
                }

                let entry = {
                    "Name": match[1],
                    "MapName": match[2],
                    "Instance": match[3] !== undefined ? (match[3].charCodeAt(0) - 0xe0b0) : 0,
                    "Position": {
                        "X": match[4],
                        "Y": match[5]
                    }
                };

                result.push(entry);
            }

            return result;
        }

        /*
        {"Name":"Yehehetoaua'pyo",
        "MobID":13400,
        "MapName":"Shaaloani",
        "LastSeenUTC":"2026-11-11T22:40:12.642514Z",
        "Position":{"X":9.044011,"Y":16.1874},
        "Dead":false,"TerritoryID":1190,"MapID":860,"Instance":0},
        */
    
        function toHuntHelper(entries /* array of object */) {
            // Add 4 more digits of "precision" for compatibility with plugin
            const now = new Date().toISOString().replace("Z", "0000Z");

            for(let ix in entries) {
                let entry = entries[ix];

                const name = entry.Name.toLowerCase();
                const zone = entry.MapName.toLowerCase();

                entry["Name"] = mobNames[name];
                entry["MobID"] = mobIds[name];
                entry["TerritoryId"] = territoryIds[zone];
                entry["MapID"] = mapIds[zone];
                entry["Dead"] = false;
                entry["LastSeenUTC"] = now;

                entries[ix] = entry;
            }

            return entries;
        }

        async function compress(text /* string */) {
            const rawBytes = new TextEncoder().encode(text);
            const stream = new Blob([rawBytes]).stream().pipeThrough(new CompressionStream("gzip"));

            const response = new Response(stream);
            return new Uint8Array(
                await response.arrayBuffer()
            );
        }

        async function processInput() {
            const input = document.getElementById("input").value;

            const entries = parseInput(input);
            const marks = toHuntHelper(entries);
            const resultBytes = await compress(JSON.stringify(marks));

            let binary = "";
            for (const byte of resultBytes) {
                binary += String.fromCharCode(byte);
            }

            const encoded = btoa(binary);

            document.getElementById("output").value = encoded;
        }

        function copyOutput() {
            const output = document.getElementById("output");

            navigator.clipboard.writeText(output.value);
        }
    </script>
</body>
</html>
